<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Breadcrumb Site</title>

<!-- Link CSS -->
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header>
    <h2>My Website</h2>
</header>

<!-- BREADCRUMB -->
<nav class="breadcrumb">
    <ul id="breadcrumb-list"></ul>
</nav>

<!-- CONTENT -->
<div class="container">
    <h1>Welcome</h1>
    <p>This is a simple website with dynamic breadcrumb navigation.</p>
</div>

<!-- JAVASCRIPT -->
<script>
const breadcrumb = document.getElementById("breadcrumb-list");

let path = window.location.pathname.split("/").filter(p => p);

let fullPath = "/";

// Home
let li = document.createElement("li");
li.innerHTML = `<a href="/">Home</a>`;
breadcrumb.appendChild(li);

// Dynamic pages
path.forEach((segment, index) => {

    fullPath += segment + "/";

    let name = segment.replace(/-/g, " ");
    name = name.charAt(0).toUpperCase() + name.slice(1);

    let li = document.createElement("li");

    if (index === path.length - 1) {
        li.classList.add("active");
        li.textContent = name;
    } else {
        li.innerHTML = `<a href="${fullPath}">${name}</a>`;
    }

    breadcrumb.appendChild(li);
});
</script>

</body>
</html>
