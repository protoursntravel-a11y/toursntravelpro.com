<script>
const breadcrumb = document.getElementById("breadcrumb-list");

let path = window.location.pathname;
let segments = path.split("/").filter(p => p);

let fullPath = "/";

// Clear old
breadcrumb.innerHTML = "";

// HOME
let liHome = document.createElement("li");
liHome.innerHTML = `<a href="/">Home</a>`;
breadcrumb.appendChild(liHome);

// 🔥 CUSTOM PAGE (China Eastern Baggage Policy)
if (path.includes("china-eastern-baggage-policy.html")) {

    let li = document.createElement("li");
    li.classList.add("active");
    li.innerHTML = `<a href="https://protoursntravel-a11y.github.io/toursntravelpro.com/china-eastern-baggage-policy.html">China Eastern Baggage Policy</a>`;
    
    breadcrumb.appendChild(li);

} else {

    // ✅ NORMAL DYNAMIC BREADCRUMB
    segments.forEach((segment, index) => {

        fullPath += segment + "/";

        let name = segment.replace(/-/g, " ");
        name = name.charAt(0).toUpperCase() + name.slice(1);

        let li = document.createElement("li");

        if (index === segments.length - 1) {
            li.classList.add("active");
            li.textContent = name;
        } else {
            li.innerHTML = `<a href="${fullPath}">${name}</a>`;
        }

        breadcrumb.appendChild(li);
    });
}
</script>
